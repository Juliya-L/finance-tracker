{% extends 'frontend/base.html' %}

{% block title %}Reset Password — Finance Tracker{% endblock %}

{% block main_layout %}{% endblock %}

{% block auth_page %}

<div style="min-height:100vh;background:#0a0a0f;display:flex;align-items:center;justify-content:center;position:relative">
  <div class="bg-grid"></div>
  <div style="width:100%;max-width:420px;padding:2rem;position:relative;z-index:1">
    <div style="text-align:center;margin-bottom:2rem">
      <div style="width:48px;height:48px;background:#534AB7;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
        <i class="ti ti-lock-open" style="color:#CECBF6;font-size:22px"></i>
      </div>
      <h1 style="font-size:22px;font-weight:500;color:#fff">Set new password</h1>
      <p style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:6px">Choose a strong password for your account</p>
    </div>

    <div style="background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.08);border-radius:14px;padding:2rem">
      <div style="margin-bottom:14px">
        <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">New password</label>
        <input id="password" type="password" placeholder="min. 8 characters"
               style="width:100%;padding:11px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"
               onfocus="this.style.borderColor='#7F77DD';this.style.background='rgba(83,74,183,0.1)'"
               onblur="this.style.borderColor='rgba(255,255,255,0.1)';this.style.background='rgba(255,255,255,0.06)'"/>
      </div>

      <div style="margin-bottom:20px">
        <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Confirm password</label>
        <input id="password2" type="password" placeholder="••••••••"
               style="width:100%;padding:11px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"
               onfocus="this.style.borderColor='#7F77DD';this.style.background='rgba(83,74,183,0.1)'"
               onblur="this.style.borderColor='rgba(255,255,255,0.1)';this.style.background='rgba(255,255,255,0.06)'"/>
      </div>

      <div id="message" style="display:none;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px"></div>

      <button onclick="handleReset()"
              style="width:100%;padding:12px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"
              onmouseover="this.style.background='#3C3489'"
              onmouseout="this.style.background='#534AB7'">
        <i class="ti ti-check"></i>
        <span id="btn-text">Set new password</span>
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const params = new URLSearchParams(window.location.search)
  const uid    = params.get('uid')
  const token  = params.get('token')

  if (!uid || !token) window.location.href = '/login/'

  async function handleReset() {
    const password  = document.getElementById('password').value
    const password2 = document.getElementById('password2').value
    const msgEl     = document.getElementById('message')
    const btnText   = document.getElementById('btn-text')

    if (password !== password2) {
      showMsg('Passwords do not match', 'error')
      return
    }
    if (password.length < 8) {
      showMsg('Password must be at least 8 characters', 'error')
      return
    }

    btnText.textContent = 'Saving...'

    try {
      const res = await fetch('/api/auth/reset-password/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid, token, password }),
      })
      const data = await res.json()

      if (res.ok) {
        showMsg('Password changed! Redirecting...', 'success')
        setTimeout(() => window.location.href = '/login/', 2000)
      } else {
        showMsg(data.error || 'Something went wrong', 'error')
      }
    } catch {
      showMsg('Connection error', 'error')
    } finally {
      btnText.textContent = 'Set new password'
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById('message')
    const isSuccess = type === 'success'
    el.style.background = isSuccess ? 'rgba(29,158,117,0.15)' : 'rgba(226,75,74,0.15)'
    el.style.border = isSuccess ? '0.5px solid rgba(29,158,117,0.3)' : '0.5px solid rgba(226,75,74,0.3)'
    el.style.color = isSuccess ? '#5DCAA5' : '#F09595'
    el.textContent = text
    el.style.display = 'block'
  }
</script>
{% endblock %}
