{% extends 'frontend/base.html' %}

{% block title %}Forgot Password — Finance Tracker{% endblock %}

{% block main_layout %}{% endblock %}

{% block auth_page %}


<div style="min-height:100vh;background:#0a0a0f;display:flex;align-items:center;justify-content:center;position:relative">
  <div class="bg-grid"></div>
  <div style="width:100%;max-width:420px;padding:2rem;position:relative;z-index:1">
    <div style="text-align:center;margin-bottom:2rem">
      <div style="width:48px;height:48px;background:#534AB7;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
        <i class="ti ti-lock" style="color:#CECBF6;font-size:22px"></i>
      </div>
      <h1 style="font-size:22px;font-weight:500;color:#fff">Forgot password?</h1>
      <p style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:6px">Enter your email and we'll send you a reset link</p>
    </div>

    <div style="background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.08);border-radius:14px;padding:2rem">
      <div style="margin-bottom:16px">
        <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Email</label>
        <input id="email" type="email" placeholder="your@email.com"
               style="width:100%;padding:11px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"
               onfocus="this.style.borderColor='#7F77DD';this.style.background='rgba(83,74,183,0.1)'"
               onblur="this.style.borderColor='rgba(255,255,255,0.1)';this.style.background='rgba(255,255,255,0.06)'"/>
      </div>

      <div id="message" style="display:none;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px"></div>

      <button onclick="handleForgot()"
              style="width:100%;padding:12px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"
              onmouseover="this.style.background='#3C3489'"
              onmouseout="this.style.background='#534AB7'">
        <i class="ti ti-send"></i>
        <span id="btn-text">Send reset link</span>
      </button>

      <div style="text-align:center;margin-top:1.2rem">
        <a href="/login/" style="font-size:13px;color:rgba(255,255,255,0.4)">
          ← Back to login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function handleForgot() {
    const email   = document.getElementById('email').value.trim()
    const msgEl   = document.getElementById('message')
    const btnText = document.getElementById('btn-text')

    if (!email) {
      msgEl.style.background = 'rgba(226,75,74,0.15)'
      msgEl.style.border = '0.5px solid rgba(226,75,74,0.3)'
      msgEl.style.color = '#F09595'
      msgEl.textContent = 'Please enter your email'
      msgEl.style.display = 'block'
      return
    }

    btnText.textContent = 'Sending...'

    try {
      const res = await fetch('/api/auth/forgot-password/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      })

      msgEl.style.background = 'rgba(29,158,117,0.15)'
      msgEl.style.border = '0.5px solid rgba(29,158,117,0.3)'
      msgEl.style.color = '#5DCAA5'
      msgEl.textContent = 'Check your email for the reset link!'
      msgEl.style.display = 'block'
    } catch {
      msgEl.style.background = 'rgba(226,75,74,0.15)'
      msgEl.style.color = '#F09595'
      msgEl.textContent = 'Connection error'
      msgEl.style.display = 'block'
    } finally {
      btnText.textContent = 'Send reset link'
    }
  }
</script>
{% endblock %}
