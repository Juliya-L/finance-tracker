{% extends 'frontend/base.html' %}

{% block title %}Categories — Finance Tracker{% endblock %}

{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem">
  <div>
    <h1 style="font-size:22px;font-weight:500;color:#fff;letter-spacing:-0.02em">Categories</h1>
    <p style="font-size:13px;color:rgba(255,255,255,0.35);margin-top:3px">Manage your income and expense categories</p>
  </div>
  <button onclick="openModal()"
          style="display:flex;align-items:center;gap:8px;padding:9px 18px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer"
          onmouseover="this.style.background='#3C3489'"
          onmouseout="this.style.background='#534AB7'">
    <i class="ti ti-plus" style="font-size:15px"></i> Add category
  </button>
</div>

<!-- Tabs -->
<div style="display:flex;gap:4px;margin-bottom:1.5rem;background:rgba(255,255,255,0.04);border-radius:8px;padding:4px;width:fit-content">
  <button id="tab-all" onclick="setTab('all')"
          style="padding:7px 18px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:#534AB7;color:#fff">
    All
  </button>
  <button id="tab-expense" onclick="setTab('expense')"
          style="padding:7px 18px;border:none;border-radius:6px;font-size:13px;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4)">
    Expenses
  </button>
  <button id="tab-income" onclick="setTab('income')"
          style="padding:7px 18px;border:none;border-radius:6px;font-size:13px;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4)">
    Income
  </button>
</div>

<!-- Categories grid -->
<div id="categories-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
  <div style="font-size:13px;color:rgba(255,255,255,0.25);padding:2rem">Loading...</div>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center">
  <div style="background:#13131a;border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:2rem;width:100%;max-width:420px;position:relative;max-height:90vh;overflow:auto">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <h2 id="modal-title" style="font-size:17px;font-weight:500;color:#fff">Add category</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:20px">×</button>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Name</label>
      <input id="m-name" type="text" placeholder="e.g. Food & Dining"
             style="width:100%;padding:10px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"/>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Type</label>
      <div style="display:flex;gap:6px">
        <button id="type-expense" onclick="setType('expense')"
                style="flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:#534AB7;color:#fff">
          Expense
        </button>
        <button id="type-income" onclick="setType('income')"
                style="flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4)">
          Income
        </button>
      </div>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase">
        Icon
      </label>

      <div id="icon-picker" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"></div>

      <input id="m-icon"
             type="text"
             placeholder="e.g. paste 🚗 🏠 ✈️"
             style="width:100%;padding:8px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:18px;outline:none"/>
    </div>

    <div style="margin-bottom:1.5rem">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase">Color</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px" id="color-picker"></div>
    </div>

    <div id="modal-error" style="display:none;background:rgba(226,75,74,0.15);border:0.5px solid rgba(226,75,74,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#F09595;margin-bottom:14px"></div>

    <div style="display:flex;gap:8px">
      <button onclick="closeModal()"
              style="flex:1;padding:11px;background:transparent;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer">
        Cancel
      </button>
      <button onclick="saveCategory()"
              style="flex:2;padding:11px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer"
              onmouseover="this.style.background='#3C3489'"
              onmouseout="this.style.background='#534AB7'">
        Save
      </button>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  requireAuth()

  const COLORS = ['#534AB7','#1D9E75','#E24B4A','#F5A623','#3B82F6','#EC4899','#8B5CF6','#14B8A6','#F59E0B','#6366F1']

  const ICONS = [
    '🍕','🍔','🍜','🍺','☕','🛒','🚗','🚌','✈️','🏠',
    '💊','🏥','🎮','🎬','🎵','📚','👗','👟','💄','🐶',
    '💪','⚽','🧘','💰','💳','🎁','🏖️','🔧','📱','💡',
    '🌿','🐱','🍷','🎂','🛋️','🧹','📦','🏫','👶','❤️'
  ]

  let currentTab = 'all'
  let currentType = 'expense'
  let selectedColor = COLORS[0]
  let selectedIcon = '📌'
  let editingId = null
  let allCategories = []

  function buildColorPicker() {
    const el = document.getElementById('color-picker')

    el.innerHTML = COLORS.map(color => `
      <div onclick="selectColor('${color}')"
           style="width:28px;height:28px;border-radius:50%;background:${color};cursor:pointer;border:2px solid ${color === selectedColor ? '#fff' : 'transparent'};transition:border .15s">
      </div>
    `).join('')
  }

  function selectColor(color) {
    selectedColor = color
    buildColorPicker()
  }

  function buildIconPicker() {
    const el = document.getElementById('icon-picker')

    el.innerHTML = ICONS.map(icon => `
      <button type="button"
              onclick="selectIcon('${icon}')"
              style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;background:${icon === selectedIcon ? 'rgba(83,74,183,0.4)' : 'rgba(255,255,255,0.05)'};border:0.5px solid ${icon === selectedIcon ? '#7F77DD' : 'rgba(255,255,255,0.08)'}">
        ${icon}
      </button>
    `).join('')
  }

  function selectIcon(icon) {
    selectedIcon = icon
    document.getElementById('m-icon').value = icon
    buildIconPicker()
  }

  function setTab(tab) {
    currentTab = tab

    const tabs = ['all', 'expense', 'income']

    tabs.forEach(t => {
      const btn = document.getElementById(`tab-${t}`)
      const active = t === tab

      btn.style.background = active ? '#534AB7' : 'transparent'
      btn.style.color = active ? '#fff' : 'rgba(255,255,255,0.4)'
      btn.style.fontWeight = active ? '500' : '400'
    })

    renderCategories()
  }

  async function loadCategories() {
    const res = await apiFetch('/api/categories/')
    if (!res) return

    const data = await res.json()

    allCategories = Array.isArray(data) ? data : (data.results || [])
    renderCategories()
  }

  function renderCategories() {
    const filtered = currentTab === 'all'
      ? allCategories
      : allCategories.filter(c => c.type === currentTab)

    const el = document.getElementById('categories-grid')

    if (!filtered.length) {
      el.innerHTML = `
        <div style="font-size:13px;color:rgba(255,255,255,0.25);padding:2rem;grid-column:1/-1;text-align:center">
          No categories yet.
          <button onclick="openModal()" style="background:none;border:none;color:#7F77DD;cursor:pointer;font-size:13px">Add one →</button>
        </div>
      `
      return
    }

    el.innerHTML = filtered.map(c => {
      const isIncome = c.type === 'income'
      const icon = c.icon || '📌'
      const color = c.color || '#534AB7'

      return `
        <div style="background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;gap:12px"
             onmouseover="this.style.borderColor='rgba(255,255,255,0.15)'"
             onmouseout="this.style.borderColor='rgba(255,255,255,0.08)'">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="width:40px;height:40px;border-radius:10px;background:${color}22;display:flex;align-items:center;justify-content:center;font-size:20px">${icon}</div>
            <span style="font-size:11px;padding:3px 8px;border-radius:20px;background:${isIncome ? 'rgba(29,158,117,0.15)' : 'rgba(226,75,74,0.15)'};color:${isIncome ? '#5DCAA5' : '#F09595'}">
              ${c.type}
            </span>
          </div>

          <div>
            <div style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.85)">${c.name}</div>
            <div style="display:flex;align-items:center;gap:5px;margin-top:4px">
              <div style="width:10px;height:10px;border-radius:50%;background:${color}"></div>
              <span style="font-size:11px;color:rgba(255,255,255,0.3)">${color}</span>
            </div>
          </div>

          <div style="display:flex;gap:6px">
            <button onclick="editCategory(${JSON.stringify(c).replace(/"/g, '&quot;')})"
                    style="flex:1;padding:6px;background:rgba(255,255,255,0.06);border:none;border-radius:6px;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px">
              <i class="ti ti-pencil"></i> Edit
            </button>
            <button onclick="deleteCategory(${c.id})"
                    style="flex:1;padding:6px;background:rgba(226,75,74,0.1);border:none;border-radius:6px;color:#F09595;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px">
              <i class="ti ti-trash"></i> Delete
            </button>
          </div>
        </div>
      `
    }).join('')
  }

  function openModal() {
    editingId = null

    document.getElementById('modal-title').textContent = 'Add category'
    document.getElementById('m-name').value = ''
    document.getElementById('m-icon').value = ''
    document.getElementById('modal-error').style.display = 'none'

    selectedColor = COLORS[0]
    selectedIcon = '📌'

    buildColorPicker()
    buildIconPicker()
    setType('expense')

    document.getElementById('modal').style.display = 'flex'
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none'
  }

  function setType(type) {
    currentType = type

    const expBtn = document.getElementById('type-expense')
    const incBtn = document.getElementById('type-income')

    if (type === 'expense') {
      expBtn.style.background = '#534AB7'
      expBtn.style.color = '#fff'
      incBtn.style.background = 'rgba(255,255,255,0.06)'
      incBtn.style.color = 'rgba(255,255,255,0.4)'
    } else {
      incBtn.style.background = '#1D9E75'
      incBtn.style.color = '#fff'
      expBtn.style.background = 'rgba(255,255,255,0.06)'
      expBtn.style.color = 'rgba(255,255,255,0.4)'
    }
  }

  function editCategory(c) {
    editingId = c.id

    document.getElementById('modal-title').textContent = 'Edit category'
    document.getElementById('m-name').value = c.name
    document.getElementById('m-icon').value = c.icon || ''
    document.getElementById('modal-error').style.display = 'none'

    selectedColor = c.color || COLORS[0]
    selectedIcon = c.icon || '📌'

    buildColorPicker()
    buildIconPicker()
    setType(c.type)

    document.getElementById('modal').style.display = 'flex'
  }

  async function saveCategory() {
    const name = document.getElementById('m-name').value.trim()
    const iconInput = document.getElementById('m-icon').value.trim()
    const errorEl = document.getElementById('modal-error')

    if (!name) {
      errorEl.textContent = 'Name is required'
      errorEl.style.display = 'block'
      return
    }

    const icon = iconInput || selectedIcon || '📌'

    const body = {
      name: name,
      type: currentType,
      icon: icon,
      color: selectedColor
    }

    const url = editingId ? `/api/categories/${editingId}/` : '/api/categories/'
    const method = editingId ? 'PUT' : 'POST'

    const res = await apiFetch(url, {
      method: method,
      body: JSON.stringify(body)
    })

    if (!res) return

    if (res.ok) {
      closeModal()
      await loadCategories()
      showToast(editingId ? 'Category updated' : 'Category created')
    } else {
      const data = await res.json()
      errorEl.textContent = data.name?.[0] || data.icon?.[0] || data.color?.[0] || 'Something went wrong'
      errorEl.style.display = 'block'
    }
  }

  async function deleteCategory(id) {
    if (!confirm('Delete this category? Transactions will become uncategorized.')) return

    const res = await apiFetch(`/api/categories/${id}/`, { method: 'DELETE' })

    if (res && res.ok) {
      await loadCategories()
      showToast('Category deleted')
    }
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal()
  })

  buildColorPicker()
  buildIconPicker()
  loadCategories()
</script>
{% endblock %}
