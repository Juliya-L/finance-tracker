{% extends 'frontend/base.html' %}

{% block title %}Transactions — Finance Tracker{% endblock %}

{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem">
  <div>
    <h1 style="font-size:22px;font-weight:500;color:#fff;letter-spacing:-0.02em">Transactions</h1>
    <p style="font-size:13px;color:rgba(255,255,255,0.35);margin-top:3px">All your income and expenses</p>
  </div>
  <button onclick="openModal()"
          style="display:flex;align-items:center;gap:8px;padding:9px 18px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer"
          onmouseover="this.style.background='#3C3489'"
          onmouseout="this.style.background='#534AB7'">
    <i class="ti ti-plus" style="font-size:15px"></i> Add transaction
  </button>
</div>

<!-- Filters -->
<div style="display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap">
  <select id="filter-type" onchange="loadTransactions()"
          style="padding:8px 12px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.7);font-size:13px;outline:none;cursor:pointer">
    <option value="">All types</option>
    <option value="income">Income</option>
    <option value="expense">Expense</option>
  </select>
  <select id="filter-category" onchange="loadTransactions()"
          style="padding:8px 12px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.7);font-size:13px;outline:none;cursor:pointer">
    <option value="">All categories</option>
  </select>
  <input id="filter-date-from" type="date" onchange="loadTransactions()"
         style="padding:8px 12px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.7);font-size:13px;outline:none"
         placeholder="From"/>
  <input id="filter-date-to" type="date" onchange="loadTransactions()"
         style="padding:8px 12px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.7);font-size:13px;outline:none"/>
  <input id="filter-search" type="text" oninput="debounceSearch()"
         placeholder="Search by note..."
         style="padding:8px 12px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.7);font-size:13px;outline:none;flex:1;min-width:150px"/>
  <button onclick="clearFilters()"
          style="padding:8px 12px;background:transparent;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer">
    Clear
  </button>
</div>

<!-- Table -->
<div style="background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden">
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 80px;padding:10px 16px;border-bottom:0.5px solid rgba(255,255,255,0.06)">
    <span style="font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.05em">Description</span>
    <span style="font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.05em">Category</span>
    <span style="font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.05em">Date</span>
    <span style="font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.05em">Amount</span>
    <span style="font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.05em"></span>
  </div>
  <div id="transactions-list">
    <div style="padding:3rem;text-align:center;font-size:13px;color:rgba(255,255,255,0.25)">Loading...</div>
  </div>
</div>

<!-- Pagination -->
<div id="pagination" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:1rem"></div>

<!-- ===== MODAL: Add / Edit transaction ===== -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center">
  <div style="background:#13131a;border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:2rem;width:100%;max-width:460px;position:relative">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <h2 id="modal-title" style="font-size:17px;font-weight:500;color:#fff">Add transaction</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:20px;line-height:1">×</button>
    </div>

    <!-- Type toggle -->
    <div style="display:flex;gap:6px;margin-bottom:1.25rem;background:rgba(255,255,255,0.05);border-radius:8px;padding:4px">
      <button id="type-expense" onclick="setType('expense')"
              style="flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:#534AB7;color:#fff">
        Expense
      </button>
      <button id="type-income" onclick="setType('income')"
              style="flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4)">
        Income
      </button>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Amount</label>
      <input id="m-amount" type="number" step="0.01" placeholder="0.00"
             style="width:100%;padding:10px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"/>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Category</label>
      <select id="m-category"
              style="width:100%;padding:10px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none">
        <option value="">No category</option>
      </select>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Date</label>
      <input id="m-date" type="date"
             style="width:100%;padding:10px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"/>
    </div>

    <div style="margin-bottom:1.5rem">
      <label style="font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase">Note (optional)</label>
      <input id="m-note" type="text" placeholder="e.g. Coffee at work"
             style="width:100%;padding:10px 14px;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none"/>
    </div>

    <div id="modal-error" style="display:none;background:rgba(226,75,74,0.15);border:0.5px solid rgba(226,75,74,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#F09595;margin-bottom:14px"></div>

    <div style="display:flex;gap:8px">
      <button onclick="closeModal()"
              style="flex:1;padding:11px;background:transparent;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer">
        Cancel
      </button>
      <button onclick="saveTransaction()" id="save-btn"
              style="flex:2;padding:11px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer"
              onmouseover="this.style.background='#3C3489'"
              onmouseout="this.style.background='#534AB7'">
        Save
      </button>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  requireAuth()

  let categories = []
  let editingId  = null
  let currentType = 'expense'
  let currentPage = 1
  let searchTimer = null

  // ---- Load categories for filters and modal ----
async function loadCategories() {
    const res = await apiFetch('/api/categories/')
    if (!res) return
    const data = await res.json()
    const categories = Array.isArray(data) ? data : (data.results || [])

    const filterSel = document.getElementById('filter-category')
    const modalSel  = document.getElementById('m-category')

    categories.forEach(c => {
      filterSel.innerHTML += `<option value="${c.id}">${c.name}</option>`
      modalSel.innerHTML  += `<option value="${c.id}">${c.name}</option>`
    })
}

  // ---- Load transactions ----
  async function loadTransactions(page = 1) {
    currentPage = page
    const type     = document.getElementById('filter-type').value
    const category = document.getElementById('filter-category').value
    const dateFrom = document.getElementById('filter-date-from').value
    const dateTo   = document.getElementById('filter-date-to').value
    const search   = document.getElementById('filter-search').value

    let url = `/api/transactions/?ordering=-date&page=${page}`
    if (type)     url += `&type=${type}`
    if (category) url += `&category=${category}`
    if (dateFrom) url += `&date_from=${dateFrom}`
    if (dateTo)   url += `&date_to=${dateTo}`
    if (search)   url += `&search=${encodeURIComponent(search)}`

    const el = document.getElementById('transactions-list')
    el.innerHTML = `<div style="padding:3rem;text-align:center;font-size:13px;color:rgba(255,255,255,0.25)">Loading...</div>`

    const res = await apiFetch(url)
    if (!res) return
    const data = await res.json()
    const items = data.results || []

    if (!items.length) {
      el.innerHTML = `<div style="padding:3rem;text-align:center;font-size:13px;color:rgba(255,255,255,0.25)">No transactions found</div>`
      document.getElementById('pagination').innerHTML = ''
      return
    }

    el.innerHTML = items.map(tx => {
      const isIncome = tx.type === 'income'
      const color    = tx.category_detail?.color || '#534AB7'
      const icon     = tx.category_detail?.icon  || '💸'
      return `
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 80px;padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.04);align-items:center"
             onmouseover="this.style.background='rgba(255,255,255,0.02)'"
             onmouseout="this.style.background='transparent'">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:32px;height:32px;border-radius:8px;background:${color}22;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${icon}</div>
            <span style="font-size:13px;color:rgba(255,255,255,0.75)">${tx.note || '—'}</span>
          </div>
          <span style="font-size:12px;color:rgba(255,255,255,0.4)">${tx.category_detail?.name || 'Uncategorized'}</span>
          <span style="font-size:12px;color:rgba(255,255,255,0.4)">${formatDate(tx.date)}</span>
          <span style="font-size:13px;font-weight:500;color:${isIncome ? '#5DCAA5' : '#F09595'}">${isIncome ? '+' : '-'}${formatMoney(tx.amount)}</span>
          <div style="display:flex;gap:6px;justify-content:flex-end">
            <button onclick="editTransaction(${JSON.stringify(tx).replace(/"/g, '&quot;')})"
                    style="padding:5px 8px;background:rgba(255,255,255,0.06);border:none;border-radius:6px;color:rgba(255,255,255,0.5);cursor:pointer;font-size:12px">
              <i class="ti ti-pencil"></i>
            </button>
            <button onclick="deleteTransaction(${tx.id})"
                    style="padding:5px 8px;background:rgba(226,75,74,0.1);border:none;border-radius:6px;color:#F09595;cursor:pointer;font-size:12px">
              <i class="ti ti-trash"></i>
            </button>
          </div>
        </div>`
    }).join('')

    renderPagination(data.count, page)
  }

  function renderPagination(total, page) {
    const pageSize  = 20
    const totalPages = Math.ceil(total / pageSize)
    const el = document.getElementById('pagination')
    if (totalPages <= 1) { el.innerHTML = ''; return }

    let html = ''
    for (let i = 1; i <= totalPages; i++) {
      const active = i === page
      html += `<button onclick="loadTransactions(${i})"
        style="padding:6px 12px;border-radius:6px;border:0.5px solid rgba(255,255,255,${active ? '0.2' : '0.08'});background:${active ? 'rgba(83,74,183,0.3)' : 'transparent'};color:${active ? '#AFA9EC' : 'rgba(255,255,255,0.4)'};font-size:13px;cursor:pointer">${i}</button>`
    }
    el.innerHTML = html
  }

  // ---- Modal ----
  function openModal() {
    editingId = null
    document.getElementById('modal-title').textContent = 'Add transaction'
    document.getElementById('m-amount').value = ''
    document.getElementById('m-category').value = ''
    document.getElementById('m-date').value = new Date().toISOString().split('T')[0]
    document.getElementById('m-note').value = ''
    document.getElementById('modal-error').style.display = 'none'
    setType('expense')
    document.getElementById('modal').style.display = 'flex'
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none'
  }

  function setType(type) {
    currentType = type
    const expBtn = document.getElementById('type-expense')
    const incBtn = document.getElementById('type-income')
    if (type === 'expense') {
      expBtn.style.background = '#534AB7'; expBtn.style.color = '#fff'
      incBtn.style.background = 'transparent'; incBtn.style.color = 'rgba(255,255,255,0.4)'
    } else {
      incBtn.style.background = '#1D9E75'; incBtn.style.color = '#fff'
      expBtn.style.background = 'transparent'; expBtn.style.color = 'rgba(255,255,255,0.4)'
    }
  }

  function editTransaction(tx) {
    editingId = tx.id
    document.getElementById('modal-title').textContent = 'Edit transaction'
    document.getElementById('m-amount').value   = tx.amount
    document.getElementById('m-category').value = tx.category || ''
    document.getElementById('m-date').value     = tx.date
    document.getElementById('m-note').value     = tx.note || ''
    document.getElementById('modal-error').style.display = 'none'
    setType(tx.type)
    document.getElementById('modal').style.display = 'flex'
  }

  async function saveTransaction() {
    const amount   = document.getElementById('m-amount').value
    const category = document.getElementById('m-category').value
    const date     = document.getElementById('m-date').value
    const note     = document.getElementById('m-note').value
    const errorEl  = document.getElementById('modal-error')

    if (!amount || !date) {
      errorEl.textContent = 'Amount and date are required'
      errorEl.style.display = 'block'
      return
    }

    const body = { amount, type: currentType, date, note }
    if (category) body.category = category

    const url    = editingId ? `/api/transactions/${editingId}/` : '/api/transactions/'
    const method = editingId ? 'PATCH' : 'POST'

    const res = await apiFetch(url, { method, body: JSON.stringify(body) })
    if (!res) return

    if (res.ok) {
      closeModal()
      loadTransactions(currentPage)
      showToast(editingId ? 'Transaction updated' : 'Transaction added')
    } else {
      const data = await res.json()
      errorEl.textContent = data.amount?.[0] || data.date?.[0] || 'Something went wrong'
      errorEl.style.display = 'block'
    }
  }

  async function deleteTransaction(id) {
    if (!confirm('Delete this transaction?')) return
    const res = await apiFetch(`/api/transactions/${id}/`, { method: 'DELETE' })
    if (res && res.ok) {
      loadTransactions(currentPage)
      showToast('Transaction deleted')
    }
  }

  function clearFilters() {
    document.getElementById('filter-type').value = ''
    document.getElementById('filter-category').value = ''
    document.getElementById('filter-date-from').value = ''
    document.getElementById('filter-date-to').value = ''
    document.getElementById('filter-search').value = ''
    loadTransactions()
  }

  function debounceSearch() {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(() => loadTransactions(), 400)
  }

  // Закрити modal по кліку на фон
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal()
  })

  loadCategories()
  loadTransactions()
</script>
{% endblock %}
